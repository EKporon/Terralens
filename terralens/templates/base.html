<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        TerraLens
        {% endblock %}
    </title>


    <!-- Google Fonts -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">


    <!-- CSS -->

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/layout.css') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/cards.css') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/responsive.css') }}">


    {% block head %}

<link
rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"
/>

<script
src="https://unpkg.com/leaflet/dist/leaflet.js">
</script>

    {% endblock %}


</head>


<body>


<header class="navbar">

    <div class="logo">

        🌍 TerraLens

    </div>


    <nav>

        <a href="/">
            Home
        </a>

        <a href="#">
            About
        </a>

        <a href="#">
            GitHub
        </a>

    </nav>


</header>



<main>

{% block content %}

{% endblock %}

</main>



<footer>

    <p>
        TerraLens © 2026
    </p>

</footer>



<script 
src="{{ url_for('static', filename='js/map.js') }}">
</script>


<script 
src="{{ url_for('static', filename='js/search.js') }}">
</script>


<script 
src="{{ url_for('static', filename='js/app.js') }}">
</script>


</body>

</html>
